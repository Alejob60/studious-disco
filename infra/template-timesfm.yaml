AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Atelier Predict - optional time-series challenger pipeline.

  This stack is SEPARATE from the main one (infra/template.yaml) on purpose. The
  forecast function falls back to the Holt-Winters champion whenever this
  pipeline has not published a fresh forecast, so nothing here is required for
  the dashboard to work.

  A Lambda container function was tried first, because it bills per request and
  scales to zero. It cannot host this model: 3008 MB is the account ceiling, the
  resident set is about 2 GB, and the function exhausted its 840 s init budget
  before the load finished. So inference runs on App Runner, which is not free
  while it exists. See the CostProfile output before leaving it up.

  Flow:
    EventBridge schedule -> batch Lambda -> App Runner (inference)
                                              -> S3 forecast.json
    forecast Lambda reads forecast.json and serves it when fresh

Parameters:
  ImageUri:
    Type: String
    Description: >
      ECR image URI for the inference service, e.g.
      123456789012.dkr.ecr.us-east-1.amazonaws.com/atelier-predict-forecast-model:1.0.0
  ImageRepositoryName:
    Type: String
    Default: atelier-predict-forecast-model
    Description: >
      Name of the ECR repository holding the image.

      The repository is deliberately NOT a resource of this stack.
      infra/deploy-timesfm.ps1 creates it so it can push the image before the
      stack exists, and CloudFormation cannot adopt an existing resource under a
      fixed name: AWS::EarlyValidation::ResourceExistenceCheck rejects the change
      set outright. Verified by bisecting the template.
  ArtifactBucket:
    Type: String
    Description: S3 bucket holding the batch Lambda bundle (created by infra/deploy-timesfm.ps1).
  CodeKey:
    Type: String
    Default: atelier-predict-batch.zip
    Description: Object key of the batch Lambda bundle.
  ScheduleExpression:
    Type: String
    Default: cron(30 4 * * ? *)
    Description: >
      UTC cron for the nightly refresh. 04:30 UTC is 23:30 in Colombia, after
      the retail day closes and before the dashboard is used.
  ForecastBucketName:
    Type: String
    Default: ''
    Description: >
      Name for the forecast bucket. Leave empty to let CloudFormation generate one.
  CpuSize:
    Type: String
    Default: '2 vCPU'
    AllowedValues: ['0.5 vCPU', '1 vCPU', '2 vCPU', '4 vCPU']
    Description: >
      2 vCPU with OMP_NUM_THREADS=1 is deliberate: inference measured 6-12 s on
      4 vCPU and 6.3-7.9 s on 2 threads, so extra parallelism bought nothing
      measurable. Size up for headroom, not throughput.
  MemorySize:
    Type: String
    Default: '4 GB'
    AllowedValues: ['2 GB', '3 GB', '4 GB', '6 GB', '8 GB', '12 GB', '16 GB']
    Description: >
      The 200M-parameter fp32 checkpoint plus the PyTorch runtime need about 2 GB
      resident, measured at 1.95 GB. bfloat16 was tried and rejected: 2.80 GB
      resident and slower to load, for the same 5.61 % WAPE.
  InferenceTimeoutSeconds:
    Type: Number
    Default: 45
    MinValue: 15
    MaxValue: 300
    Description: >
      Client-side ceiling for one inference call. Measured 6-12 s, with a first
      call on a fresh instance paying the model load first.

Conditions:
  # Long form on purpose: nested short-form functions inside a flow sequence are
  # not reliably parsed by every YAML loader CloudFormation uses.
  BucketNameProvided:
    Fn::Not:
      - Fn::Equals:
          - !Ref ForecastBucketName
          - ''

Resources:
  # ---------------------------------------------------------------------------
  # Forecast storage
  # ---------------------------------------------------------------------------
  ForecastBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !If [BucketNameProvided, !Ref ForecastBucketName, !Ref 'AWS::NoValue']
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      # Forecasts are superseded daily; keeping a year of them has no value and
      # the lifecycle rule also prevents the bucket growing without bound.
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-forecasts
            Status: Enabled
            ExpirationInDays: 30
            NoncurrentVersionExpiration:
              NoncurrentDays: 7
          - Id: abort-incomplete-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  # ---------------------------------------------------------------------------
  # Inference: the model container on App Runner
  #
  # App Runner bills for the time a service exists, not the time it is used, and
  # cannot scale to zero. A Lambda container function bills per request and would
  # be the cheaper shape, but it cannot host this model: 3008 MB is the account
  # ceiling, the resident set is ~2 GB, and the function exhausted its 840 s init
  # budget. Measured in a plain container with 1 vCPU and 3 GB, the same model
  # loads in 30 s, so the gap is the environment, not the image.
  # ---------------------------------------------------------------------------
  TimesfmAccessRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: tasks.apprunner.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # App Runner requires its baseline ECR permissions on the task role.
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSAppRunnerECRAccessRole'
      Description: Task role for the inference service. Inference makes no AWS API calls.

  TimesfmService:
    Type: AWS::AppRunner::Service
    Properties:
      ServiceName: atelier-predict-forecast-model
      SourceConfiguration:
        ImageRepository:
          ImageConfiguration:
            Port: '8080'
            # Runtime deliberately omitted. Declaring it is rejected here:
            # AWS::EarlyValidation::PropertyValidation fails on Runtime for
            # python310, python311 and python312 alike, while the same template
            # without it is accepted. App Runner reads the runtime from the base
            # image, which is python:3.12-slim.
            #
            # A real HTTP service here, so plain uvicorn: no awslambdaric. App
            # Runner makes an actual request, unlike Lambda.
            StartCommand: >-
              uvicorn main:app --host 0.0.0.0 --port 8080 --workers 1
              --timeout-keep-alive 75
            EnvironmentVariables:
              - Name: TIMESFM_REPO
                Value: google/timesfm-2.5-200m-pytorch
              - Name: HF_HUB_OFFLINE
                Value: '1'
              - Name: OMP_NUM_THREADS
                Value: '1'
          ImageIdentifier: !Ref ImageUri
          ImageRepositoryType: ECR
      AutoScalingConfiguration:
        # MinSize 1 is the floor: App Runner cannot scale to zero. This is the
        # reason the nightly job does not live here.
        MinSize: 1
        MaxSize: 2
        TargetValue: 50
        MaxConcurrency: 1
      HealthCheckConfiguration:
        HealthCheckPath: /health
        HealthCheckInterval: 30
        HealthCheckProtocol: HTTP
        HealthCheckTimeout: 5
        HealthyThresholdCount: 1
        UnhealthyThresholdCount: 3
      InstanceConfiguration:
        # 2 vCPU: inference measured 6-12 s on 4 vCPU and 6.3-7.9 s on 2 threads,
        # so the extra parallelism is headroom, not throughput.
        Cpu: !Ref CpuSize
        Memory: !Ref MemorySize
      NetworkConfiguration:
        IngressConfiguration:
          - IsPubliclyAccessible: true
        EgressConfiguration:
          EgressType: DEFAULT
          EgressIpMode: NAT
      Tags:
        - Key: purpose
          Value: atelier-predict-forecast-challenger
        - Key: cost
          Value: 'billed for the time the service exists'

  # ---------------------------------------------------------------------------
  # Nightly orchestrator
  # ---------------------------------------------------------------------------
  ForecastBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ForecastBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt ForecastBucket.Arn
              - !Sub '${ForecastBucket.Arn}/*'
            Condition:
              Bool:
                'aws:SecureTransport': 'false'

  BatchLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/atelier-predict-batch
      RetentionInDays: 14

  BatchRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
      Description: Reads and writes the forecast object, and calls the inference service.
      Policies:
        - PolicyName: forecast-bucket
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadHistoryAndWriteForecast
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                # Scoped to the two objects this function touches.
                Resource: !Sub '${ForecastBucket.Arn}/forecast.json'
              - Sid: ReadUploadedHistory
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub '${ForecastBucket.Arn}/history.json'
              - Sid: DistinguishMissingHistory
                Effect: Allow
                # Without this, S3 answers GetObject on a missing key with 403
                # AccessDenied naming s3:ListBucket instead of 404 NoSuchKey,
                # because it will not reveal whether an object exists to a caller
                # that cannot list. The history file is optional, so the caller has
                # to be able to tell "not uploaded yet" from "denied".
                Action: s3:ListBucket
                Resource: !Sub '${ForecastBucket.Arn}'
                Condition:
                  StringLike:
                    's3:prefix':
                      - history.json
              - Sid: EnforceSse
                Effect: Allow
                Action: 's3:PutObject'
                Resource: !Sub '${ForecastBucket.Arn}/forecast.json'
                Condition:
                  StringEquals:
                    's3:x-amz-server-side-encryption': AES256

  BatchFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: atelier-predict-batch
      Runtime: nodejs22.x
      Handler: batch/index.handler
      Role: !GetAtt BatchRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Ref CodeKey
      # Comfortably above one inference call: 6-12 s measured, plus a slower first
      # call on an instance that is still loading the model.
      Timeout: 180
      MemorySize: 512
      Description: 'Nightly refresh: calls the inference service and publishes the result.'
      Environment:
        Variables:
          FORECAST_BUCKET: !Ref ForecastBucket
          TIMESFM_SERVICE_URL: !GetAtt TimesfmService.ServiceUrl
          FORECAST_HORIZON: '14'
          TIMESFM_TIMEOUT_MS: '45000'
      LoggingConfig:
        LogFormat: JSON
        ApplicationLogLevel: INFO
        SystemLogLevel: WARN

  # The schedule targets the orchestrator, which is what decides whether a result is
  # worth publishing. Invoking inference directly would skip that validation.
  BatchInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt BatchFunction.Arn
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt NightlySchedule.Arn

  NightlySchedule:
    Type: AWS::Events::Rule
    Properties:
      Name: atelier-predict-nightly-forecast
      Description: Refreshes the challenger forecast from the inference service.
      ScheduleExpression: !Ref ScheduleExpression
      State: ENABLED
      Targets:
        - Id: batch
          Arn: !GetAtt BatchFunction.Arn

Outputs:
  ForecastBucket:
    Description: Bucket holding forecast.json and the optional uploaded history.json.
    Value: !Ref ForecastBucket
  ImageRepositoryUri:
    Description: Where the image was pushed from.
    Value: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${ImageRepositoryName}'
  InferenceServiceUrl:
    Description: Base URL of the inference service on App Runner.
    Value: !GetAtt TimesfmService.ServiceUrl
  NightlyScheduleArn:
    Description: EventBridge rule driving the refresh.
    Value: !GetAtt NightlySchedule.Arn
  CostProfile:
    Description: What this stack costs while it is up.
    Value: >
      App Runner bills for the time the service exists and cannot scale to zero,
      so this costs roughly 120-180 USD per month at 2 vCPU / 4 GB with MinSize 1.
      A Lambda container function would be cheaper but cannot host this model:
      3008 MB is the account ceiling, the resident set is ~2 GB, and the function
      exhausted its 840 s init budget without finishing the load. The forecast the
      dashboard serves does not depend on this: the champion answers whenever no
      fresh forecast.json exists.
