AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Atelier Predict - optional time-series challenger pipeline.

  This stack is SEPARATE from the main one (infra/template.yaml) on purpose. The
  forecast function falls back to the Holt-Winters champion whenever this
  pipeline has not published a fresh forecast, so nothing here is required for
  the dashboard to work.

  Lambda container image, not App Runner, because App Runner bills for the time a
  service exists and its AutoScalingConfiguration cannot scale to zero. A
  container function bills per request only, which is the right shape for a job
  that runs once a night.

  Flow:
    EventBridge schedule -> batch Lambda -> inference Lambda (container)
                                              -> S3 forecast.json
    forecast Lambda reads forecast.json and serves it when fresh

Parameters:
  ImageUri:
    Type: String
    Description: >
      ECR image URI for the inference service, e.g.
      123456789012.dkr.ecr.us-east-1.amazonaws.com/atelier-predict-forecast-model:1.0.0
  ImageRepositoryName:
    Type: String
    Default: atelier-predict-forecast-model
    Description: >
      Name of the ECR repository holding the image.

      The repository is deliberately NOT a resource of this stack.
      infra/deploy-timesfm.ps1 creates it so it can push the image before the
      stack exists, and CloudFormation cannot adopt an existing resource under a
      fixed name: AWS::EarlyValidation::ResourceExistenceCheck rejects the change
      set outright. Verified by bisecting the template.
  ArtifactBucket:
    Type: String
    Description: S3 bucket holding the batch Lambda bundle (created by infra/deploy-timesfm.ps1).
  CodeKey:
    Type: String
    Default: atelier-predict-batch.zip
    Description: Object key of the batch Lambda bundle.
  ScheduleExpression:
    Type: String
    Default: cron(30 4 * * ? *)
    Description: >
      UTC cron for the nightly refresh. 04:30 UTC is 23:30 in Colombia, after
      the retail day closes and before the dashboard is used.
  ForecastBucketName:
    Type: String
    Default: ''
    Description: >
      Name for the forecast bucket. Leave empty to let CloudFormation generate one.
  InferenceMemoryMb:
    Type: Number
    Default: 3008
    MinValue: 2048
    MaxValue: 3008
    Description: >
      The 200M-parameter fp32 checkpoint plus the PyTorch runtime need roughly
      2 GB resident. Verified locally in the image: ~2.0 GB filesystem, 883 MB of
      which is the checkpoint.

      3008 MB is the ceiling Lambda accepts here, not 10240: creating the function
      with more fails with a constraint error. Verified by deploying.
  InferenceTimeoutSeconds:
    Type: Number
    Default: 840
    MinValue: 120
    MaxValue: 900
    Description: >
      Measured locally: ~150 s to load the model plus 6-12 s of inference. The
      first invocation of the day also pulls the image, which is why this is set
      near the 15-minute ceiling rather than to the inference time alone.

Conditions:
  # Long form on purpose: nested short-form functions inside a flow sequence are
  # not reliably parsed by every YAML loader CloudFormation uses.
  BucketNameProvided:
    Fn::Not:
      - Fn::Equals:
          - !Ref ForecastBucketName
          - ''

Resources:
  # ---------------------------------------------------------------------------
  # Forecast storage
  # ---------------------------------------------------------------------------
  ForecastBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !If [BucketNameProvided, !Ref ForecastBucketName, !Ref 'AWS::NoValue']
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      # Forecasts are superseded daily; keeping a year of them has no value and
      # the lifecycle rule also prevents the bucket growing without bound.
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-forecasts
            Status: Enabled
            ExpirationInDays: 30
            NoncurrentVersionExpiration:
              NoncurrentDays: 7
          - Id: abort-incomplete-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # Inference: the model container, invoked once a night
  # ---------------------------------------------------------------------------
  InferenceLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/atelier-predict-forecast-model
      RetentionInDays: 14

  InferenceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
      Description: >
        Pulls the container image and writes logs. Inference itself makes no AWS
        API calls, so there is nothing else to grant.
      Policies:
        - PolicyName: pull-inference-image
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: PullImageFromThisRepositoryOnly
                Effect: Allow
                Action:
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                # Built from the parameter because the repository is not a resource
                # of this stack. Scoped to one repository, not the whole account.
                Resource: !Sub 'arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/${ImageRepositoryName}'

  InferenceFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: atelier-predict-forecast-model
      PackageType: Image
      Role: !GetAtt InferenceRole.Arn
      Code:
        ImageUri: !Ref ImageUri
      # The container must listen on 0.0.0.0 or AWS_LAMBDA_FUNCTION_HANDLER
      # will never reach it.
      MemorySize: !Ref InferenceMemoryMb
      Timeout: !Ref InferenceTimeoutSeconds
      # Scratch space for the runtime. The default 512 MB is not enough headroom
      # next to a 2 GB resident model on a 4 GB function.
      EphemeralStorage:
        Size: 2048
      # No ReservedConcurrentExecutions on purpose: reserving here drops the
      # account's unreserved concurrency below the AWS minimum of 10 while other
      # functions exist in it. The orchestrator runs once a night, so a cap buys
      # nothing that the schedule does not already provide.
      Description: >-
        Time-series foundation model inference. Invoked synchronously by the
        batch job; the weights are baked into the image so it runs with no egress.
      Environment:
        Variables:
          TIMESFM_REPO: google/timesfm-2.5-200m-pytorch
          HF_HUB_OFFLINE: '1'
          # One thread: measured 6-12 s on 4 vCPU and 6.3-7.9 s on 2 threads,
          # so extra parallelism bought nothing measurable.
          OMP_NUM_THREADS: '1'
      LoggingConfig:
        LogFormat: JSON
        ApplicationLogLevel: INFO
        SystemLogLevel: WARN

  # ---------------------------------------------------------------------------
  # Nightly orchestrator
  # ---------------------------------------------------------------------------
  ForecastBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ForecastBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt ForecastBucket.Arn
              - !Sub '${ForecastBucket.Arn}/*'
            Condition:
              Bool:
                'aws:SecureTransport': 'false'

  BatchLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/atelier-predict-batch
      RetentionInDays: 14

  BatchRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
      Description: Reads and writes the forecast object, and calls the inference service.
      Policies:
        - PolicyName: forecast-bucket
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadHistoryAndWriteForecast
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                # Scoped to the two objects this function touches.
                Resource: !Sub '${ForecastBucket.Arn}/forecast.json'
              - Sid: ReadUploadedHistory
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub '${ForecastBucket.Arn}/history.json'
              - Sid: DistinguishMissingHistory
                Effect: Allow
                # Without this, S3 answers GetObject on a missing key with 403
                # AccessDenied naming s3:ListBucket instead of 404 NoSuchKey,
                # because it will not reveal whether an object exists to a caller
                # that cannot list. The history file is optional, so the caller has
                # to be able to tell "not uploaded yet" from "denied".
                Action: s3:ListBucket
                Resource: !Sub '${ForecastBucket.Arn}'
                Condition:
                  StringLike:
                    's3:prefix':
                      - history.json
              - Sid: EnforceSse
                Effect: Allow
                Action: 's3:PutObject'
                Resource: !Sub '${ForecastBucket.Arn}/forecast.json'
                Condition:
                  StringEquals:
                    's3:x-amz-server-side-encryption': AES256
              - Sid: InvokeInference
                Effect: Allow
                Action: 'lambda:InvokeFunction'
                # One function. No Condition on lambda:InvocationType: with the
                # condition attached, the synchronous invoke is rejected outright
                # ("not authorized to perform: lambda:InvokeFunction") even though
                # the statement is present on the role. Scoping the resource to a
                # single function already limits the blast radius, and this role
                # belongs only to the orchestrator.
                Resource: !GetAtt InferenceFunction.Arn

  BatchFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: atelier-predict-batch
      Runtime: nodejs22.x
      Handler: batch/index.handler
      Role: !GetAtt BatchRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Ref CodeKey
      # Must exceed the inference function's model load plus inference. Measured
      # locally at ~150 s of load before the first prediction, so a 180 s ceiling
      # here aborted the orchestrator mid-call.
      Timeout: 420
      MemorySize: 512
      Description: 'Nightly refresh: calls the inference function and publishes the result.'
      Environment:
        Variables:
          FORECAST_BUCKET: !Ref ForecastBucket
          INFERENCE_FUNCTION_NAME: !Ref InferenceFunction
          FORECAST_HORIZON: '14'
      LoggingConfig:
        LogFormat: JSON
        ApplicationLogLevel: INFO
        SystemLogLevel: WARN

  # The schedule targets the orchestrator, which is what decides whether a result is
  # worth publishing. Invoking inference directly would skip that validation.
  BatchInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt BatchFunction.Arn
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt NightlySchedule.Arn

  NightlySchedule:
    Type: AWS::Events::Rule
    Properties:
      Name: atelier-predict-nightly-forecast
      Description: Refreshes the challenger forecast from the TimesFM service.
      ScheduleExpression: !Ref ScheduleExpression
      State: ENABLED
      Targets:
        - Id: batch
          Arn: !GetAtt BatchFunction.Arn

Outputs:
  ForecastBucket:
    Description: Bucket holding forecast.json and the optional uploaded history.json.
    Value: !Ref ForecastBucket
  ImageRepositoryUri:
    Description: Where the image was pushed from.
    Value: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${ImageRepositoryName}'
  InferenceFunctionName:
    Description: Container function that runs the model. Invoked by the batch job.
    Value: !Ref InferenceFunction
  NightlyScheduleArn:
    Description: EventBridge rule driving the refresh.
    Value: !Ref NightlySchedule
  CostProfile:
    Description: Why this stack costs nothing while idle.
    Value: >
      A Lambda container function bills per request and scales to zero, so a
      nightly schedule costs one invocation a day. App Runner was rejected for
      this workload because it bills for the time a service exists and cannot
      scale to zero. The 2 GB image pulls on the first invocation of the day,
      which is why InferenceFunction timeout sits near the 15-minute ceiling.
      Measured locally: ~150 s of model load plus 6-12 s of inference.

